<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hystrix Dashboard</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fb;
      color: #182230;
    }

    body {
      margin: 0;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    .status {
      border: 1px solid #cad5e2;
      border-radius: 999px;
      padding: 7px 12px;
      background: #ffffff;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid #d7e0ea;
      border-radius: 8px;
      background: #ffffff;
      padding: 18px;
      box-shadow: 0 8px 24px rgb(16 24 40 / 8%);
    }

    .card h2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 18px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .pill {
      border-radius: 999px;
      padding: 4px 9px;
      background: #dff8e8;
      color: #136c36;
      font-size: 12px;
      font-weight: 700;
    }

    .pill.open {
      background: #ffe4e0;
      color: #a23a2a;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid #e0e7ef;
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .metric span {
      display: block;
      margin-bottom: 6px;
      color: #526174;
      font-size: 12px;
    }

    .metric strong {
      font-size: 24px;
      line-height: 1;
    }

    .details {
      margin-top: 14px;
      color: #526174;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #0f1722;
        color: #e6edf5;
      }

      .status,
      .card {
        background: #151f2c;
        border-color: #2b3a4d;
      }

      .metric {
        background: #111a25;
        border-color: #2b3a4d;
      }

      .metric span,
      .details {
        color: #a7b4c4;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Hystrix Dashboard</h1>
    <div id="summary" class="status">Waiting for streams...</div>
  </header>

  <section class="grid" id="cards"></section>
</main>

<script>
  const services = [
    { id: 'pricing', name: 'Pricing Service' },
    { id: 'inventory', name: 'Inventory Service' },
    { id: 'order', name: 'Order Service' }
  ];

  const cards = document.getElementById('cards');
  const summary = document.getElementById('summary');
  const latest = new Map();

  function card(service) {
    const element = document.createElement('article');
    element.className = 'card';
    element.id = `card-${service.id}`;
    element.innerHTML = `
      <h2>${service.name}<span class="pill">CONNECTING</span></h2>
      <div class="metrics">
        <div class="metric"><span>Requests</span><strong data-key="requestCount">0</strong></div>
        <div class="metric"><span>Error %</span><strong data-key="errorPercentage">0</strong></div>
        <div class="metric"><span>Success</span><strong data-key="rollingCountSuccess">0</strong></div>
        <div class="metric"><span>Failures</span><strong data-key="rollingCountFailure">0</strong></div>
        <div class="metric"><span>Short Circuits</span><strong data-key="rollingCountShortCircuited">0</strong></div>
        <div class="metric"><span>Bulkhead Load</span><strong data-key="bulkheadLoad">0</strong></div>
      </div>
      <div class="details">Waiting for ${service.id} stream data.</div>
    `;
    cards.appendChild(element);
  }

  function connect(service) {
    const source = new EventSource(`/streams/${service.id}`);
    source.onmessage = event => render(service, event.data);
    source.onerror = () => {
      const element = document.getElementById(`card-${service.id}`);
      const pill = element.querySelector('.pill');
      pill.textContent = 'DISCONNECTED';
      pill.classList.add('open');
      element.querySelector('.details').textContent = `Unable to read /streams/${service.id}.`;
      updateSummary();
    };
  }

  function render(service, raw) {
    const rows = JSON.parse(raw);
    const metrics = Array.isArray(rows) ? rows[0] : rows;
    latest.set(service.id, metrics);

    const element = document.getElementById(`card-${service.id}`);
    const pill = element.querySelector('.pill');
    const open = Boolean(metrics.isCircuitBreakerOpen);
    pill.textContent = `${metrics.circuitBreakerState || (open ? 'OPEN' : 'CLOSED')}`;
    pill.classList.toggle('open', open);

    const detail = metrics.resilience4j || {};
    const threadPool = detail.threadPoolBulkhead || {};
    const semaphore = detail.bulkhead || {};
    const bulkheadLoad = threadPool.queueDepth ?? (
      (semaphore.maxAllowedConcurrentCalls || 0) - (semaphore.availableConcurrentCalls || 0)
    );

    element.querySelectorAll('[data-key]').forEach(node => {
      const key = node.getAttribute('data-key');
      const value = key === 'bulkheadLoad' ? bulkheadLoad : metrics[key];
      node.textContent = value ?? 0;
    });

    element.querySelector('.details').textContent =
      `Command ${metrics.name}; retry successes ${detail.retry?.successfulWithRetry ?? 0}; ` +
      `rate limiter permits ${detail.rateLimiter?.availablePermissions ?? 0}.`;
    updateSummary();
  }

  function updateSummary() {
    const connected = latest.size;
    const open = [...latest.values()].filter(item => item.isCircuitBreakerOpen).length;
    summary.textContent = `${connected}/${services.length} streams active, ${open} open circuit breakers`;
  }

  services.forEach(service => {
    card(service);
    connect(service);
  });
</script>
</body>
</html>
