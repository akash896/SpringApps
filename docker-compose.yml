services:
  pricing-service:
    build: ./pricing-service
    ports:
      - "8083:8083"
  inventory-service:
    build: ./inventory-service
    ports:
      - "8082:8082"
    environment:
      PRICING_SERVICE_URL: http://pricing-service:8083
    depends_on:
      - pricing-service
  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      - inventory-service
  hystrix-dashboard:
    build: ./hystrix-dashboard
    ports:
      - "8090:8090"
    environment:
      PRICING_SERVICE_URL: http://pricing-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      ORDER_SERVICE_URL: http://order-service:8081
    depends_on:
      - pricing-service
      - inventory-service
      - order-service
